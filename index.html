<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>TeamoAgent — 网页端智能体</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%27%20viewBox%3D%270%200%2032%2032%27%3E%3Ccircle%20cx%3D%2716%27%20cy%3D%2716%27%20r%3D%2715%27%20fill%3D%27%230a0a0a%27%2F%3E%3Cpath%20d%3D%27M16%201a15%2015%200%200%201%200%2030z%27%20fill%3D%27%23fff%27%2F%3E%3Ccircle%20cx%3D%2716%27%20cy%3D%2716%27%20r%3D%273.4%27%20fill%3D%27%230a0a0a%27%2F%3E%3C%2Fsvg%3E" />
<link rel="stylesheet" href="css/styles.css" />
<!-- LaTeX 渲染（KaTeX）：CDN 加载失败时自动降级为代码块显示 -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.21/dist/katex.min.css" crossorigin="anonymous" />
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.21/dist/katex.min.js" crossorigin="anonymous"></script>
</head>
<body>
<div class="app">

  <!-- ═══ 侧栏 ═══ -->
  <aside class="sidebar">
    <div class="logo">
      <span class="logo-mark"><svg viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg"><circle cx="16" cy="16" r="11.4" stroke="currentColor" stroke-width="2.4"/><path d="M16 4.6a11.4 11.4 0 0 1 0 22.8z" fill="currentColor"/><circle cx="16" cy="4.6" r="2.7" fill="currentColor"/><circle cx="6.1" cy="21.7" r="2.7" fill="currentColor"/><circle cx="25.9" cy="21.7" r="2.7" fill="currentColor"/></svg></span>
      <span class="logo-text">TEAMO<i>AGENT</i></span>
      <button id="sidebar-toggle" class="icon-btn" type="button" title="收起侧栏">⟨</button>
    </div>

    <!-- 模型选择 -->
    <div class="side-section">
      <div class="side-label">模型 <button id="refresh-models" class="icon-btn" title="从 GET /v1/models 刷新">⟳</button></div>
      <div class="picker" id="model-picker">
        <button id="model-btn" class="model-btn" type="button">
          <span class="model-btn-main">
            <span class="model-btn-row"><span id="model-btn-icon" class="model-btn-icon"></span><span id="model-btn-name" class="mono">claude-sonnet-5</span></span>
            <span id="model-btn-provider" class="model-btn-provider">Anthropic</span>
          </span>
          <span class="model-btn-caret">▾</span>
        </button>
        <div id="model-menu" class="dd-menu">
          <div class="dd-search-wrap"><input id="model-search" class="dd-search mono" placeholder="搜索模型…" /></div>
        </div>
      </div>
    </div>

    <!-- 会话记录（回滚操作全部在对话区进行） -->
    <div class="side-section grow">
      <div class="side-label">会话记录
        <button id="new-session" class="mini-btn" type="button" title="新建会话">＋ 新建</button>
      </div>
      <div id="session-list" class="cp-list"></div>
    </div>

    <div class="side-footer">
      <span id="transport-badge" class="transport" title="">直连模式</span>
      <span id="balance-badge" class="transport" title=""></span>
      <span id="conv-stats" class="conv-stats"></span>
      <div class="side-footer-btns">
        <button id="key-btn" class="mini-btn" type="button">API Key</button>
        <button id="export-btn" class="mini-btn" type="button" title="导出会话 JSON">导出</button>
        <button id="import-btn" class="mini-btn" type="button" title="从 JSON 导入会话">导入</button>
        <input id="import-input" type="file" accept="application/json,.json" hidden />
        <button id="theme-toggle" class="mini-btn" type="button" title="切换主题">◑</button>
      </div>
    </div>
  </aside>

  <!-- ═══ 主区 ═══ -->
  <main class="main">
    <header class="topbar">
      <div class="status"><span id="status-dot" class="dot ok"></span><span id="status-text"></span><span id="time-stats" class="time-stats mono"></span></div>
      <div class="topbar-right">
        <button id="thinking-toggle" class="pill on" type="button" title="思考模式：Claude→thinking.budget_tokens / GPT·Gemini·Grok→reasoning_effort / DeepSeek→reasoning / GLM→thinking；不支持的模型自动降级">🧠 思考</button>
        <button id="sandbox-toggle" class="pill on" type="button" title="沙箱：Agent 可执行 JS/Python/C++ 代码、读写虚拟文件并委派子智能体">⌗ 沙箱</button>
        <button id="fast-toggle" class="pill" type="button" title="TeamoRouter Fast mode（service_tier=fast，2x 计费，仅 GPT 系列）">⚡ Fast</button>
        <button id="panel-toggle" class="pill" type="button" title="沙箱面板">◧</button>
      </div>
    </header>

    <div id="messages" class="messages"></div>

    <button id="jump-bottom" type="button" title="定位到最新输出"><span class="jump-ico">↓</span>最新输出</button>
    <button id="undo-pill" type="button" title="撤销刚才的回滚">⤺ 撤销回滚</button>

    <div class="composer-wrap">
      <div id="attach-chips" class="attach-chips" style="display:none"></div>
      <div class="composer">
        <button id="attach-btn" type="button" title="添加附件（图片 / 文本 / 代码，可拖拽或粘贴）"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg></button>
        <input id="attach-input" type="file" multiple hidden accept="image/png,image/jpeg,image/gif,image/webp,.txt,.md,.js,.ts,.py,.json,.csv,.log,.html,.css,.xml,.yaml,.yml,.sh,.sql,.vue,.go,.rs,.java,.c,.cpp,.h,.rb,.php,.toml,.ini,.env,.conf" />
        <textarea id="composer-input" rows="1" placeholder="输入消息，Enter 发送 / Shift+Enter 换行，可拖入或粘贴附件…"></textarea>
        <button id="send-btn" type="button" title="发送 (Enter)"><span id="send-ico">↑</span></button>
      </div>
      <div class="composer-hint">
        由 <a href="https://api.teamorouter.com" target="_blank" rel="noopener" class="mono">api.teamorouter.com</a> 提供路由 ·
        Claude 走 <span class="mono">/v1/messages</span> 原生协议 · 其余模型走 <span class="mono">/v1/chat/completions</span>
      </div>
    </div>
  </main>

  <!-- ═══ 沙箱面板（默认收起；宽屏并入网格不遮挡，窄屏为浮层 + 遮罩）═══ -->
  <aside id="sandbox-panel" class="panel collapsed">
    <div id="panel-tabs" class="panel-tabs">
      <button class="active" data-tab="console" type="button">控制台</button>
      <button data-tab="files" type="button">文件</button>
      <button data-tab="agents" type="button">子智能体</button>
    </div>
    <div id="tab-console" class="panel-body">
      <div id="exec-list" class="exec-list"></div>
    </div>
    <div id="tab-files" class="panel-body" style="display:none">
      <div class="files-toolbar"><span class="side-label" style="border:0;padding:0">虚拟文件系统</span><button id="clear-files" class="mini-btn" type="button">清空</button></div>
      <div id="file-list" class="file-list"></div>
      <div id="file-viewer" class="file-viewer"></div>
    </div>
    <div id="tab-agents" class="panel-body" style="display:none">
      <div class="agents-hint">主 Agent 按需通过 <span class="mono">dispatch_subagent</span> 委派任务（同模型 · 专属提示词 · 独立上下文）</div>
      <div id="agent-list" class="agent-list"></div>
    </div>
  </aside>
</div>

<!-- 侧栏展开把手（侧栏收起时浮现）+ 窄屏浮层遮罩 -->
<button id="sidebar-fab" type="button" title="展开侧栏">☰</button>
<div id="overlay-backdrop" class="overlay-backdrop"></div>

<!-- ═══ API Key 弹窗 ═══ -->
<div id="key-modal" class="modal">
  <div class="modal-card">
    <div class="modal-head"><h3>TeamoRouter API Key</h3><button id="key-close" class="icon-btn" type="button">✕</button></div>
    <p class="modal-desc">Key 以 <span class="mono">sk-teamo-</span> 开头，在 <a href="https://teamorouter.com/dashboard?tab=api-keys" target="_blank" rel="noopener">TeamoRouter 控制台</a> 创建。仅保存在本机浏览器 localStorage，随请求头直发网关，不经过任何第三方。</p>
    <input id="key-input" class="key-input mono" type="password" placeholder="sk-teamo-xxxxxxxx…" spellcheck="false" autocomplete="off" />
    <div class="modal-actions">
      <button id="key-save" class="primary-btn" type="button">保存</button>
    </div>
  </div>
</div>

<div id="toasts" class="toasts"></div>

<script type="module" src="js/main.js"></script>
</body>
</html>
