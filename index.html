<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<!-- CSP（P1-4）：
     · 渲染层无内联脚本（全部外部文件），script 仅放行 self 与 Pyodide CDN
     · style 'unsafe-inline' 为 KaTeX 输出与少量 style 属性所需
     · worker 放行 self 与 blob:（sandbox.js 的 blob Worker 兜底通道）
     · connect 仅放行网关（.com 与 .cn 双域名，中国网络自动择路）/ C++ 远程执行 / Pyodide CDN / 本站代理
     · 'wasm-unsafe-eval' 为 Pyodide 在 Worker 内编译 WebAssembly 所需 -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' https://api.teamorouter.com https://api.teamorouter.cn https://godbolt.org https://cdn.jsdelivr.net; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'" />
<meta name="app-version" content="2026.09.22.7" />
<meta name="app-release" content="V1.0" />
<title>TeamoAgent V1.0 正式版 — 网页端智能体</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D'http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg'%20viewBox%3D'0%200%2032%2032'%20aria-hidden%3D'true'%3E%3Ccircle%20cx%3D'16'%20cy%3D'16'%20r%3D'15'%20fill%3D'%230a0a0a'%2F%3E%3Ccircle%20cx%3D'16'%20cy%3D'16'%20r%3D'13'%20fill%3D'none'%20stroke%3D'%23f4f4f4'%20stroke-opacity%3D'0.18'%20stroke-width%3D'1.3'%2F%3E%3Cpath%20d%3D'M22.128%2021.142%20A8.000%208.000%200%200%201%209.872%2021.142'%20fill%3D'none'%20stroke%3D'%23f4f4f4'%20stroke-opacity%3D'0.55'%20stroke-width%3D'2.2'%20stroke-linecap%3D'round'%2F%3E%3Cpath%20d%3D'M8.482%2018.736%20A8.000%208.000%200%200%201%2014.611%208.122'%20fill%3D'none'%20stroke%3D'%23f4f4f4'%20stroke-opacity%3D'0.55'%20stroke-width%3D'2.2'%20stroke-linecap%3D'round'%2F%3E%3Cpath%20d%3D'M17.389%208.122%20A8.000%208.000%200%200%201%2023.518%2018.736'%20fill%3D'none'%20stroke%3D'%23f4f4f4'%20stroke-opacity%3D'0.55'%20stroke-width%3D'2.2'%20stroke-linecap%3D'round'%2F%3E%3Ccircle%20cx%3D'16'%20cy%3D'16'%20r%3D'2.7'%20fill%3D'%23f4f4f4'%2F%3E%3Ccircle%20cx%3D'16.000'%20cy%3D'24.000'%20r%3D'1.8'%20fill%3D'%23f4f4f4'%2F%3E%3Ccircle%20cx%3D'9.072'%20cy%3D'12.000'%20r%3D'1.8'%20fill%3D'%23f4f4f4'%2F%3E%3Ccircle%20cx%3D'22.928'%20cy%3D'12.000'%20r%3D'1.8'%20fill%3D'%23f4f4f4'%2F%3E%3C%2Fsvg%3E" />
<link rel="stylesheet" href="css/styles.css?v=2026.09.22.7" />
<!-- LaTeX 渲染（KaTeX）：CDN 加载失败时自动降级为代码块显示 -->
<link rel="stylesheet" href="assets/katex/katex.min.css" />
<script defer src="assets/katex/katex.min.js"></script>
<script defer src="assets/md/markdown-it.min.js"></script>
</head>
<body>
<div class="app">

  <!-- ═══ 侧栏 ═══ -->
  <aside class="sidebar">
    <div class="logo">
      <span class="logo-mark"><svg viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg"><circle cx="16" cy="16" r="13" fill="none" stroke="currentColor" stroke-opacity="0.18" stroke-width="1.3"/><path d="M22.128 21.142 A8.000 8.000 0 0 1 9.872 21.142" fill="none" stroke="currentColor" stroke-opacity="0.55" stroke-width="2.2" stroke-linecap="round"/><path d="M8.482 18.736 A8.000 8.000 0 0 1 14.611 8.122" fill="none" stroke="currentColor" stroke-opacity="0.55" stroke-width="2.2" stroke-linecap="round"/><path d="M17.389 8.122 A8.000 8.000 0 0 1 23.518 18.736" fill="none" stroke="currentColor" stroke-opacity="0.55" stroke-width="2.2" stroke-linecap="round"/><circle cx="16" cy="16" r="2.7" fill="currentColor"/><circle cx="16.000" cy="24.000" r="1.8" fill="currentColor"/><circle cx="9.072" cy="12.000" r="1.8" fill="currentColor"/><circle cx="22.928" cy="12.000" r="1.8" fill="currentColor"/></svg></span>
      <span class="logo-text">TEAMO<i>AGENT</i></span>
      <span class="ver-badge" title="Teamo V1.0 正式版">V1.0</span>
      <button id="sidebar-toggle" class="icon-btn" type="button" title="收起侧栏" aria-label="收起侧栏"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14.5 6 8.5 12l6 6"/><path d="M19 4v16"/></svg></button>
    </div>

    <!-- 模型选择 -->
    <div class="side-section">
      <div class="side-label">模型 <button id="refresh-models" class="icon-btn" title="从 GET /v1/models 刷新" aria-label="刷新模型列表"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.5 12a8.5 8.5 0 1 1-2.6-6.1"/><path d="M20.5 4.2V9h-4.8"/></svg></button></div>
      <div class="picker" id="model-picker">
        <button id="model-btn" class="model-btn" type="button">
          <span class="model-btn-main">
            <span class="model-btn-row"><span id="model-btn-icon" class="model-btn-icon"></span><span id="model-btn-name" class="mono">claude-sonnet-5</span></span>
            <span id="model-btn-provider" class="model-btn-provider">Anthropic</span>
          </span>
          <span class="model-btn-caret">▾</span>
        </button>
        <div id="model-menu" class="dd-menu">
          <div class="dd-search-wrap"><input id="model-search" class="dd-search mono" placeholder="搜索模型…" aria-label="搜索模型" /></div>
          <div class="dd-foot">
            <label for="image-model" title="文生图 / 图片编辑模型：不作为对话模型直接选择，由主智能体通过 generate_image 工具调用（POST /v1/images/generations · /v1/images/edits）">生图模型 · Agent 调用</label>
            <select id="image-model" class="dd-select mono" aria-label="生图模型"></select>
          </div>
        </div>
      </div>
    </div>

    <!-- 会话记录（回滚操作全部在对话区进行） -->
    <div class="side-section grow">
      <div class="side-label">会话记录
        <span class="side-label-btns">
          <button id="new-session" class="mini-btn" type="button" title="新建会话（当前已是空会话时直接复用，不会堆空记录）"><svg class="btn-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14"/><path d="M5 12h14"/></svg>新建</button>
          <button id="clear-sessions" class="mini-btn" type="button" title="一键清除所有会话记录（含各自的消息、检查点与沙箱文件），不可恢复"><svg class="btn-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16"/><path d="M9.5 7V4.8h5V7"/><path d="M6.5 7l.9 12.1A1.5 1.5 0 0 0 8.9 20.4h6.2a1.5 1.5 0 0 0 1.5-1.3L17.5 7"/></svg>清空</button>
        </span>
      </div>
      <div id="session-list" class="cp-list"></div>
    </div>

    <div class="side-footer">
      <span id="transport-badge" class="transport" title="">直连模式</span>
      <span id="build-stamp" class="transport mono" title="构建版本；若与最新改动不符，请强制刷新（Ctrl/Cmd + Shift + R）"></span>
      <span id="conv-stats" class="conv-stats"></span>
      <div class="side-footer-btns">
        <button id="key-btn" class="mini-btn" type="button">API Key</button>
        <button id="export-btn" class="mini-btn" type="button" title="导出会话 JSON">导出</button>
        <button id="import-btn" class="mini-btn" type="button" title="从 JSON 导入会话">导入</button>
        <input id="import-input" type="file" accept="application/json,.json" hidden />
        <button id="theme-toggle" class="mini-btn icon-only" type="button" title="切换明暗主题" aria-label="切换明暗主题"><svg class="pill-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5Z"/></svg></button>
      </div>
    </div>
  </aside>

  <!-- ═══ 主区 ═══ -->
  <main class="main">
    <div id="turn-bar" class="turn-bar" aria-hidden="true"></div>
    <header class="topbar">
      <div class="status"><span id="status-dot" class="dot ok"></span><span id="status-text"></span><span id="time-stats" class="time-stats mono"></span></div>
      <div class="topbar-right">
        <button id="thinking-toggle" class="pill on" type="button" title="思考模式：Claude→thinking.budget_tokens / GPT·Gemini·Grok→reasoning_effort / DeepSeek→reasoning / GLM→thinking；不支持的模型自动降级"><svg class="pill-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5a3 3 0 1 0-5.997.125 4 4 0 0 0-2.526 5.77 4 4 0 0 0 .556 6.588A4 4 0 1 0 12 18Z"/><path d="M12 5a3 3 0 1 1 5.997.125 4 4 0 0 1 2.526 5.77 4 4 0 0 1-.556 6.588A4 4 0 1 1 12 18Z"/><path d="M15 13a4.5 4.5 0 0 1-3-4 4.5 4.5 0 0 1-3 4"/></svg>思考</button>
        <button id="sandbox-toggle" class="pill on" type="button" title="代码沙箱：开启后 Agent 可执行 JS/Python/C++ 代码（文件读写、生图、子智能体委派不受此开关影响）"><svg class="pill-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="18" height="18" x="3" y="3" rx="2"/><path d="m8 9 3 3-3 3"/><path d="M13 15h3"/></svg>沙箱</button>
        <button id="web-toggle" class="pill on" type="button" title="联网：只用模型 API 自带的网页搜索请求格式（Claude → /v1/messages 的 web_search_20250305 服务器工具；GPT → /v1/responses 的 tools:[{type:web_search}]），不调用任何第三方搜索 API；当前模型没有原生格式时自动不联网"><svg class="pill-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3.2 9.5h17.6"/><path d="M3.2 14.5h17.6"/><path d="M12 3a14 14 0 0 1 0 18 14 14 0 0 1 0-18"/></svg>联网</button>
        <button id="fast-toggle" class="pill" type="button" title="TeamoRouter Fast mode（service_tier=fast，2x 计费，仅 GPT 系列）"><svg class="pill-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13 2 4.6 13.2a.6.6 0 0 0 .48.97H11l-1.2 7.4a.35.35 0 0 0 .62.27l8.56-11.2a.6.6 0 0 0-.48-.97H14l1.2-7.4a.35.35 0 0 0-.62-.27Z"/></svg>快速</button>
        <button id="panel-toggle" class="pill" type="button" title="沙箱面板：文件树 / 下载 / 清空" aria-label="展开或收起沙箱面板"><svg class="pill-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7.5A1.5 1.5 0 0 1 4.5 6h4.2l1.8 2.2h9A1.5 1.5 0 0 1 21 9.7v8.8A1.5 1.5 0 0 1 19.5 20h-15A1.5 1.5 0 0 1 3 18.5Z"/></svg>面板</button>
      </div>
    </header>

    <div id="messages" class="messages"></div>

    <button id="jump-bottom" type="button" title="定位到最新输出"><span class="jump-ico">↓</span>最新输出</button>
    <button id="undo-pill" type="button" title="撤销刚才的回滚">⤺ 撤销回滚</button>

    <div class="composer-wrap">
      <div id="attach-chips" class="attach-chips" style="display:none"></div>
      <div class="composer">
        <button id="attach-btn" type="button" title="添加附件（图片 / 文本 / 代码，可拖拽或粘贴）" aria-label="添加附件"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg></button>
        <input id="attach-input" type="file" multiple hidden accept="image/png,image/jpeg,image/gif,image/webp,.txt,.md,.js,.ts,.py,.json,.csv,.log,.html,.css,.xml,.yaml,.yml,.sh,.sql,.vue,.go,.rs,.java,.c,.cpp,.h,.rb,.php,.toml,.ini,.env,.conf" />
        <textarea id="composer-input" rows="1" aria-label="消息输入框" placeholder="输入消息，Enter 发送 / Shift+Enter 换行，可拖入或粘贴附件…"></textarea>
        <button id="send-btn" type="button" title="发送 (Enter)" aria-label="发送"><span id="send-ico">↑</span></button>
      </div>
      <div class="composer-hint">
        由 <a href="https://teamorouter.cn" target="_blank" rel="noopener" class="mono">TeamoRouter</a> 网关提供路由（自动择路）·
        Claude 走 <span class="mono">/v1/messages</span> 原生协议 · 其余模型走 <span class="mono">/v1/chat/completions</span>
      </div>
    </div>
  </main>

  <!-- ═══ 沙箱面板（默认收起；宽屏并入网格不遮挡，窄屏为浮层 + 遮罩）═══ -->
  <aside id="sandbox-panel" class="panel collapsed">
    <div id="panel-tabs" class="panel-tabs">
      <button class="active" data-tab="files" type="button">文件</button>
      <button data-tab="agents" type="button">子智能体</button>
    </div>
    <div id="tab-files" class="panel-body">
      <div class="files-toolbar">
        <!-- 第一行：标题；第二行：统计 + 打包/清空（原来挤在一行时被按钮挤掉过体积数字） -->
        <span class="side-label files-title">虚拟文件系统</span>
        <div class="files-bar">
        <span id="files-count" class="files-count mono" aria-live="polite"></span>
        <span class="files-actions">
          <button id="download-zip" class="mini-btn" type="button" title="把沙箱内全部文件按目录结构打包下载（.zip，图片还原为原始二进制）"><svg class="btn-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3.5v11.2"/><path d="m7.5 10.5 4.5 4.5 4.5-4.5"/><path d="M4.5 17.5v1.8a1.2 1.2 0 0 0 1.2 1.2h12.6a1.2 1.2 0 0 0 1.2-1.2v-1.8"/></svg>ZIP</button>
          <button id="clear-files" class="mini-btn" type="button" title="清空虚拟文件系统里的全部文件">清空</button>
        </span>
        </div>
      </div>
      <div id="file-list" class="file-list"></div>
      <div id="file-viewer" class="file-viewer"></div>
    </div>
    <div id="tab-agents" class="panel-body" style="display:none">
      <div class="agents-hint">主 Agent 按需通过 <span class="mono">dispatch_subagent</span> 委派任务（同模型 · 专属提示词 · 独立上下文）</div>
      <div id="agent-list" class="agent-list"></div>
    </div>
  </aside>
</div>

<!-- 侧栏展开把手（侧栏收起时浮现）+ 窄屏浮层遮罩 -->
<button id="sidebar-fab" type="button" title="展开侧栏" aria-label="展开侧栏"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6h16"/><path d="M4 12h16"/><path d="M4 18h10"/></svg></button>
<div id="overlay-backdrop" class="overlay-backdrop"></div>

<!-- ═══ API Key 弹窗 ═══ -->
<div id="key-modal" class="modal" role="dialog" aria-modal="true" aria-labelledby="key-modal-title">
  <div class="modal-card">
    <div class="modal-head"><h3 id="key-modal-title">TeamoRouter API Key</h3><button id="key-close" class="icon-btn" type="button" aria-label="关闭"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 6 18 18"/><path d="M18 6 6 18"/></svg></button></div>
    <p class="modal-desc">Key 以 <span class="mono">sk-teamo-</span> 开头，在 <a href="https://teamorouter.com/dashboard?tab=api-keys" target="_blank" rel="noopener">TeamoRouter 控制台</a> 创建。仅保存在本机浏览器 localStorage，随请求头直发网关，不经过任何第三方。</p>
    <input id="key-input" class="key-input mono" type="password" placeholder="sk-teamo-xxxxxxxx…" spellcheck="false" autocomplete="off" />
    <div class="modal-actions">
      <button id="key-save" class="primary-btn" type="button">保存</button>
    </div>
  </div>
</div>

<div id="toasts" class="toasts"></div>

<script type="module" src="js/main.js?v=2026.09.22.7"></script>
</body>
</html>
