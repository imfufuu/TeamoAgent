name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: 单元测试 + 语法检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 运行单测
        run: node tests/agent.test.mjs
      - name: P0 执行内核独立验收（统一状态机/预算与风险治理/工具契约校验）
        run: node tests/execution-kernel-smoke.mjs
      - name: P1 可恢复执行独立验收（检查点/幂等账本/交互确认/记忆生命周期/轨迹级评测）
        run: node tests/recovery-kernel-smoke.mjs
      - name: P2 内核独立验收（统一执行上下文 / 策略版本化 / 审计三层目标 / 指标门禁 / 故障注入 / 实验）
        run: node tests/p2-kernel-smoke.mjs
      - name: P2 分层评测集（10 类 × 12 条 = N=120；P/R/F1 + 95% Wilson CI + 基线 5pt 门禁）
        run: node tests/p2-eval.mjs
      - name: 审核资产完整性（ORT 版本/模型分片/CSP 炸点/fail-closed 钉子）
        run: node tests/assets-integrity.mjs
      - name: 服务端语法检查
        run: python3 -m py_compile server.py
      - name: 本地中继护栏自检（git 白名单 / SSRF / HTML 抽取）
        run: python3 tests/server_checks.py
      - name: 前端模块语法检查
        run: |
          for f in js/*.js; do node --check "$f" || exit 1; done
          echo "全部 JS 模块语法通过"
