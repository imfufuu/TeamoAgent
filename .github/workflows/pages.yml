name: Pages (Actions 部署)

# 手动触发的 GitHub Pages 部署通道。
#
# 本仓库的 Pages 目前配置为「Deploy from a branch / main」（legacy 模式），
# 推送到 main 后由 GitHub 自带的 pages-build-deployment 自动发布，
# 因此这里默认不自动运行，避免与 legacy 构建互相覆盖。
#
# 若要改用 Actions 部署：
#   1. Settings → Pages → Source 选 "GitHub Actions"
#   2. 在本页 Actions 标签手动 Run workflow（或把下面的 workflow_dispatch 改为 push 触发）
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: 打包静态站点
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    name: 发布到 GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
