name: Pages (Actions 部署)

# GitHub Pages 部署通道（仓库 Settings → Pages → Source = GitHub Actions）。
# 推送 main 即自动发布；workflow_dispatch 保留为手动重发入口。
# concurrency 同一组避免重叠部署。（2026-09-28 起 legacy「Deploy from a branch」已弃用——
# 此前注释描述的 legacy 模式与仓库实际配置不符，已修正。）
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: 打包静态站点
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    name: 发布到 GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
