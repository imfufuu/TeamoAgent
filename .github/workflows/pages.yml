name: Pages

# 用 GitHub Actions 部署到 GitHub Pages（而非「Deploy from a branch」），
# 因此不必把变更合并到 main 也能发布——直接在当前工作分支上发布。
on:
  push:
    branches: [arena/01a0b912-teamoagent, main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 只保留一个部署任务，后到的排队（避免并发发布互相覆盖）
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    name: 单元测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/agent.test.mjs

  build:
    name: 打包静态站点
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    name: 发布到 GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
